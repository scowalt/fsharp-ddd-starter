name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  

      - name: Install pinned SDK, backup, and infrastructure tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  
        with:
          version: 2026.9.3
          install_args: asdf:mise-plugins/mise-dotnet-core restic rclone jq opentofu

      - name: Validate
        run: ./scripts/validate.sh

      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
