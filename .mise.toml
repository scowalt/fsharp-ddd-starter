min_version = "2026.7.13"

[tools]
dotnet-legacy = "10.0.400"
gitleaks = "8.30.1"
lefthook = "2.1.12"

[tasks.setup]
description = "Install pinned tools and Git hooks"
run = [
  "dotnet tool restore",
  "mise exec -- lefthook install",
]

[tasks.validate]
description = "Run the complete local validation suite"
run = "./scripts/validate.sh"
