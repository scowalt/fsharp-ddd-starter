min_version = "2026.7.13"

[tools]
# Explicit backend: dotnet-legacy is a machine-local plugin name, not a registry tool.
"asdf:mise-plugins/mise-dotnet-core" = "10.0.400"
gitleaks = "8.30.1"
lefthook = "2.1.12"
restic = "0.19.1"
rclone = "1.75.1"
jq = "1.8.2"
opentofu = "1.12.6"

[tasks.setup]
description = "Install pinned tools and Git hooks"
run = [
  "dotnet tool restore",
  "mise exec -- lefthook install",
]

[tasks.validate]
description = "Run the complete local validation suite"
run = "./scripts/validate.sh"
