when:
  - event: pull_request
  - event: push
    branch: main

clone:
  - name: git
    image: docker.io/woodpeckerci/plugin-git:2.10.1@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
    settings:
      ref: ${CI_COMMIT_SHA}
      partial: false
      depth: 0
      lfs: false
      recursive: false
      merge-pull-request: true
      git-user-name: Woodpecker CI
      git-user-email: ci@woodpecker.invalid

steps:
  - name: validate
    image: docker.io/library/ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
    environment:
      DEBIAN_FRONTEND: noninteractive
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      MISE_AUTO_INSTALL: 'false'
      MISE_TRUSTED_CONFIG_PATHS: /woodpecker
    commands:
      - apt-get update
      - apt-get install --no-install-recommends -y bash ca-certificates coreutils curl git libicu-dev libkrb5-3 libssl-dev ripgrep unzip util-linux xz-utils zlib1g
      - |
        printf 'captured_head=%s\n' "$${CI_COMMIT_SHA}"
        git for-each-ref --format='fetched_target=%(refname) %(objectname)' refs/remotes/origin
        git show --no-patch --format='tested_commit=%H%ntested_parents=%P%ntested_tree=%T' HEAD
      - |
        case "$(uname -m)" in
          aarch64) asset=linux-arm64; checksum=d8fa3d3fa2a21979c54c548967325a9db72f2a157996e8c536f62947b25592b7 ;;
          x86_64) asset=linux-x64; checksum=981bd9179cc089114a87b491fce2c4007ab05b5445dee7ad08e87e5dffcc154d ;;
          *) exit 1 ;;
        esac
        curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 "https://github.com/jdx/mise/releases/download/v2026.9.3/mise-v2026.9.3-$asset" --output /usr/local/bin/mise
        printf '%s  %s\n' "$checksum" /usr/local/bin/mise | sha256sum --check -
        chmod 0755 /usr/local/bin/mise
      - mise install asdf:mise-plugins/mise-dotnet-core restic rclone jq opentofu
      - eval "$(mise env --shell bash)"
      - export DOTNET_ROOT="$(mise where asdf:mise-plugins/mise-dotnet-core@10.0.400)"
      - ./scripts/validate.sh
  - name: trivy
    image: docker.io/aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
    environment:
      TRIVY_SCANNERS: vuln,misconfig
      TRIVY_SEVERITY: HIGH,CRITICAL
      TRIVY_IGNORE_UNFIXED: 'true'
      TRIVY_EXIT_CODE: '1'
      TRIVY_CACHE_DIR: .cache/trivy
    commands:
      - trivy fs .
