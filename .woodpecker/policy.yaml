when:
  - event: [push, tag, pull_request]

clone:
  - name: git
    image: docker.io/woodpeckerci/plugin-git:2.10.1@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
    settings:
      ref: ${CI_COMMIT_SHA}
      partial: false
      depth: 0
      lfs: false
      recursive: false
      merge-pull-request: true
      git-user-name: Woodpecker CI
      git-user-email: ci@woodpecker.invalid

steps:
  - name: no-comments
    image: ghcr.io/astral-sh/uv:0.11.32-python3.14-trixie@sha256:adafbab0c780d8bd995039e9dfd800f95a057867d283deee7d5eb1b3126551b2
    commands:
      - |
        printf 'captured_head=%s\n' "$${CI_COMMIT_SHA}"
        git for-each-ref --format='fetched_target=%(refname) %(objectname)' refs/remotes/origin
        git show --no-patch --format='tested_commit=%H%ntested_parents=%P%ntested_tree=%T' HEAD
      - uv run --no-project --python 3.14 --with-requirements .comment-policy/requirements.txt python .comment-policy/check.py
      - uv run --no-project --python 3.14 --with-requirements .comment-policy/requirements.txt python -m unittest discover -s .comment-policy -p 'test_*.py'
